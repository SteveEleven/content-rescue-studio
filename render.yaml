# One free Render Web Service. Frontend and API share this process.
# Leave LLM_THINKING unset. Gemini rejects enable_thinking.
# Enter LLM_API_KEY in the Render Dashboard when prompted. Do not commit it.
services:
  - type: web
    name: content-rescue-studio
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: node server/index.mjs
    healthCheckPath: /api/health
    envVars:
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: LLM_MODEL
        value: gemini-3-flash-preview
      - key: LLM_API_KEY
        sync: false
